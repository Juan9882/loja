<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Gamers</title>
    <link rel="stylesheet" href="Style/Estilo.css">
</head>
<body>
    <header>
        <h1>Loja de Gamers</h1>
    </header>


    <div class="catalogo">
    </div>

    <div class="produto">
        <img src="notebook.jpg" alt="descricao aqui">
        <h2>Notebook Gamer</h2>
        <p class="descricao">
            Ideal para estudos e jogos.
        </p>
        <p class="preco">
            R$ 2.500,00
        </p>
        <button>Comprar</button>
    </div>

    <div class="produto">
        <img src="teclado.jpg" alt="descricao aqui">
        <h2>Teclado Gamer</h2>
        <p class="descricao">
            Muito bom para jogar
        </p>
        <p class="preco">
            R$ 750,00
        </p>
        <button>Comprar</button>
    </div>

    <div class="produto">
        <img src="ps5.jpg" alt="descricao aqui">
        <h2>Ps5 tematica homem aranha</h2>
        <p class="descricao">
            Bom para jogos
        </p>
        <p class="preco">
            R$ 3800,00
        </p>
        <button>Comprar</button>
    </div>

    <div class="produto">
        <img src="jogos2.png" alt="descricao aqui">
        <h2>Jogo do six seven</h2>
        <p class="descricao">
            Melhor jogo do ano
        </p>
        <p class="preco">
            R$ 49,90
        </p>
        <button>Comprar</button>
    </div>


    
</body>
</html>
